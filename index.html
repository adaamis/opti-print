<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OptiPrint |  Otimização de Folha e Aproveitamento Gráfico</title>
    <meta
      name="description"
      content="OptiPrint: Suíte de inteligência gráfica e otimização de folhas de papel. Calcule rendimento, aninhamento misto e exporte em SVG 1:1."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('optiprint_theme');
          var isDark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FBFBFA] text-stone-900 antialiased selection:bg-stone-200 selection:text-stone-900 dark:bg-[#0B111E] dark:text-[#F1F5F9]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
